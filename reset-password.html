<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password · Lestari Alam</title>
<style>body{font-family:system-ui,sans-serif;background:#EAEFE2;color:#16241B;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.card{width:min(440px,100%);background:#F5F8EF;border:1px solid rgba(28,58,40,.16);border-radius:20px;padding:28px}
h1{margin:0 0 8px;font-size:24px}p{margin:0 0 16px;color:#3E6B47;font-size:14px}
label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(28,58,40,.16);background:#EAEFE2;font-size:15px;box-sizing:border-box}
button{margin-top:18px;width:100%;padding:13px;border:none;border-radius:999px;background:#1C3A28;color:#EAEFE2;font-weight:800;cursor:pointer}
#msg{margin-top:14px;font-size:14px;min-height:20px;color:#3E6B47}</style></head>
<body><div class="card">
<h1>Set new password</h1><p>Enter your new password below.</p>
<label>New password</label><input id="password" type="password">
<label>Confirm password</label><input id="confirm" type="password">
<button id="go">Update password</button><div id="msg"></div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase = createClient("https://jypruhcygbilvlxfimlo.supabase.co","sb_publishable_biYNeEjlpge2Fxf1pX0-kA_HKT59QYb");
const $ = id => document.getElementById(id);
$("go").onclick = async () => {
  const pw = $("password").value, cf = $("confirm").value; $("msg").textContent = "";
  if (pw.length < 8) return $("msg").textContent = "Password must be at least 8 characters.";
  if (pw !== cf) return $("msg").textContent = "Passwords do not match.";
  const { error } = await supabase.auth.updateUser({ password: pw });
  $("msg").textContent = error ? error.message : "Password updated. You can now log in.";
};
</script></body></html>
